name: Tailwind Build Check

on:
  push:
    branches:
      - tailwind
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-tailwind:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Tailwind CSS
        run: npm run tw:build